<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft shadow -->
    <filter id="dropShadowM" x="-10%" y="-5%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <filter id="softGlowM" x="-5%" y="-5%" width="110%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#4A044E" flood-opacity="0.2" />
    </filter>

    <!-- Magenta Soft Gradient -->
    <linearGradient id="magentaMainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E879F9" />
      <stop offset="45%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="magentaRingGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86198F" />
      <stop offset="100%" stop-color="#581C87" />
    </linearGradient>
  </defs>

  <!-- Layer 3: Bottom backing board (Deep Plum Velvet) -->
  <rect x="56" y="80" width="400" height="400" rx="44" fill="#3B0764" />

  <!-- Layer 2: Middle paper sheets -->
  <rect x="56" y="70" width="400" height="390" rx="44" fill="#FDF4FF" opacity="0.9" />
  <rect x="56" y="60" width="400" height="390" rx="44" fill="#FFFFFF" filter="url(#dropShadowM)" />

  <!-- Layer 1: Front cover sheet (Soft Magenta) -->
  <rect x="56" y="50" width="400" height="375" rx="44" fill="url(#magentaMainGrad)" />

  <!-- Inner highlight curve on top page -->
  <path d="M 100 52 L 412 52 A 44 44 0 0 1 454 94 L 454 96 A 44 44 0 0 0 412 54 L 100 54 A 44 44 0 0 0 58 96 L 58 94 A 44 44 0 0 1 100 52 Z" fill="#FFFFFF" opacity="0.3" />

  <!-- 3 Text Lines (Rounded bars in deep violet/magenta) -->
  <rect x="126" y="155" width="260" height="34" rx="17" fill="#701A75" opacity="0.9" />
  <rect x="126" y="240" width="260" height="34" rx="17" fill="#701A75" opacity="0.9" />
  <rect x="126" y="325" width="260" height="34" rx="17" fill="#701A75" opacity="0.9" />

  <!-- 4 Spiral Ring Loops at top -->
  <!-- Ring 1 -->
  <rect x="100" y="22" width="44" height="66" rx="22" fill="url(#magentaRingGrad)" filter="url(#softGlowM)" />
  <rect x="110" y="30" width="12" height="42" rx="6" fill="#FFFFFF" opacity="0.4" />

  <!-- Ring 2 -->
  <rect x="184" y="22" width="44" height="66" rx="22" fill="url(#magentaRingGrad)" filter="url(#softGlowM)" />
  <rect x="194" y="30" width="12" height="42" rx="6" fill="#FFFFFF" opacity="0.4" />

  <!-- Ring 3 -->
  <rect x="284" y="22" width="44" height="66" rx="22" fill="url(#magentaRingGrad)" filter="url(#softGlowM)" />
  <rect x="294" y="30" width="12" height="42" rx="6" fill="#FFFFFF" opacity="0.4" />

  <!-- Ring 4 -->
  <rect x="368" y="22" width="44" height="66" rx="22" fill="url(#magentaRingGrad)" filter="url(#softGlowM)" />
  <rect x="378" y="30" width="12" height="42" rx="6" fill="#FFFFFF" opacity="0.4" />
</svg>
